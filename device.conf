# devices/x6826b/device.conf: the phone, for the common repository's device tooling (tools/hakios-device.py; the same
# words as hakios-sm7325's device.conf). Its SoC's layer is the common repository's mtk/mt6768/.
device x6826b
	title	Infinix Hot 20 (X6826B)
	vendor	Infinix
	soc	mt6768
	defconfig	x6826b_defconfig
	firmware	pull-firmware.sh
	maintainer	the HakiOS developers (README.md)
	status display works 720x1640, scale 2 (fbscale=2 fbfit=3)
	status touch works OmniVision TD4160 over SPI2, firmware sent by the loader (touchscreen=2)
	status buttons works power and volume, keypad at 0x10010000 (buttons=2)
	status cpu works 4 cores, big cores clocked (cpus=4 mtk_cpufreq=3)
	status gpu works Mali-G52 MC2 brought up by the kernel (mali=1); panfrost and Metal drew CoreAnimation with the earlier user space, not yet the common tree's
	status storage partial the system image read off the eMMC, read only (emmc_root=1)
	status sensors partial accelerometer through the SCP sensor hub, rotation (scp_step=7)
	status wifi partial CONNSYS up, WMT channel over BTIF/STP; no network yet (connsys_step=8)
	status bluetooth missing same CONNSYS as Wi-Fi; HCI over STP not yet
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing
